// SketchPilot root build file.
// UI: pure Kotlin + Jetpack Compose + Material 3. Engine: Java interop layer (port tracked separately).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.0.21'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
